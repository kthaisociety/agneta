name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: kthaisociety/workflows/.github/workflows/semantic-pr.yml@v0.2.0
    permissions:
      pull-requests: read

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: docker build -t agneta:ci .
      - name: Smoke check the image
        run: |
          docker run -d --name agneta -p 8000:8000 agneta:ci
          body=$(curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/health) || { docker logs agneta; exit 1; }
          if [ "$body" != "ok" ]; then
            echo "GET /health answered '$body', want 'ok'"
            docker logs agneta
            exit 1
          fi